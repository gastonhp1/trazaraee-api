services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trazaraee
      POSTGRES_PASSWORD: trazaraee
      POSTGRES_DB: trazaraee
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trazaraee"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://trazaraee:trazaraee@db:5432/trazaraee
      ADMIN_KEY: ${ADMIN_KEY:?definí ADMIN_KEY en el entorno o en un .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - photos:/srv/photos
    ports:
      - "8000:8000"

volumes:
  pgdata:
  photos:
